name: Build APK 2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Full v2 Project
        run: |
          set -e

          mkdir -p project

          ZIP="Mohamed_Slomah_Heir_of_Silence_Full_v2.zip"

          echo "Using project: $ZIP"

          test -f "$ZIP"

          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."

      - name: Find Android Project
        run: |
          set -e

          PROJECT_DIR=$(find project -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          test -n "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Fix Java and Kotlin Compatibility
        run: |
          set -e

          FILE="$PROJECT_DIR/app/build.gradle.kts"

          test -f "$FILE"

          if ! grep -q "sourceCompatibility = JavaVersion.VERSION_17" "$FILE"; then
            sed -i '/android {/a\
                compileOptions {\
                    sourceCompatibility = JavaVersion.VERSION_17\
                    targetCompatibility = JavaVersion.VERSION_17\
                }' "$FILE"
         
