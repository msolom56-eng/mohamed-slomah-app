name: Build APK 2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Full v2 Project
        run: |
          mkdir -p project
          unzip -q Mohamed_Slomah_Heir_of_Silence_Full_v2.zip -d project

      - name: Build APK
        run: |
          cd project/Mohamed_Slomah_Heir_of_Silence_Full_v2
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohamed-Slomah-App-v2
          path: "project/Mohamed_Slomah_Heir_of_Silence_Full_v2/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
